# Default simulation configuration
# All values from §4 (Locked Parameter Table) of the execution plan
# Using reduced units: ε=1.0, σ=1.0, m=1.0, τ=σ√(m/ε)=1.0

# === Chain parameters ===
chain:
  N: 30                      # Bead count (main). §4: "Good middle ground"
  dimension: 3                # 3D simulation

# === Bond potential (harmonic — clean first version per §4 note) ===
# Harmonic: U = 0.5 * k_bond * (|r_ij| - r0)²
# Harmonic: F = -k_bond * (|r_ij| - r0) * r_hat_ij
bond:
  type: "harmonic"            # "harmonic" or "fene"
  k_bond: 100.0               # ε/σ². §4: "k_bond ≈ 100 ε/σ² (much stiffer than ε)"
  r0: 1.0                     # σ. §4: "r₀ = σ = 1.0"
                               # Note: emergent mean bond length with WCA is ~1.06σ (WCA still repels at r₀)

# === FENE parameters (for future use, standard Kremer-Grest) ===
# FENE: U = -0.5 * k * R0² * ln(1 - (r/R0)²)
# FENE: F = -k * r / (1 - (r/R0)²)
fene:
  k: 30.0                     # ε/σ². §4: "Standard KG value"
  R0: 1.5                     # σ. §4: "Standard KG value"
  # Resulting equilibrium bond length with WCA: ≈0.965σ

# === WCA excluded-volume (Weeks-Chandler-Andersen) ===
# Repulsive LJ, cut at r_cut = 2^(1/6) * σ ≈ 1.122σ
# U_WCA = 4ε[(σ/r)¹² - (σ/r)⁶] + ε  for r < r_cut
# F_WCA = 24ε/r * [2(σ/r)¹² - (σ/r)⁶] * r_hat  for r < r_cut
wca:
  epsilon: 1.0                 # §4: "Reduced units"
  sigma: 1.0                   # §4: "Reduced units"
  # r_cut = 2^(1/6) * sigma ≈ 1.12246σ (computed, not set manually)

# === Thermodynamic parameters ===
thermostat:
  kBT: 1.0                    # §4: "Standard reduced units"
  gamma: 1.0                  # §4: "Start at 1.0; this is also your 4th OOD axis"
  mass: 1.0                   # Reduced units

# === Integration ===
integrator:
  type: "overdamped"           # "overdamped" (Brownian) or "underdamped" (Langevin)
  dt: 0.001                    # τ. §4: "Start conservative (0.001–0.005)"
  # Overdamped update (§8.1):
  #   noise = sqrt(2*kBT*dt/gamma) * N(0,1)
  #   r[i] = r[i] + (dt/gamma) * F[i] + noise

# === Simulation length ===
# Unit conversion: physical_time_τ = n_steps × dt
# Rouse time for N=30: τ_R ≈ N² = 900τ. Need ≥ 3τ_R burn-in = 2700τ.
simulation:
  T_steps: 37000               # 3.7M steps × 0.001τ/step = 3700τ total
  n_burnin: 27000              # 2.7M steps × 0.001τ/step = 2700τ ≈ 3 Rouse times
  save_every: 100                # §4: "every 100 integration steps"

# === Trajectory generation ===
trajectories:
  count_pilot: 25              # §4: "20–30" for pilot validation
  count_production: 150        # Plan target: 400–600 (§4). Using 150 for initial runs; scale up for production.
  count_ood: 125               # §4: "100–150 each" for OOD arms

# === Data split ===
split:
  train: 0.70                  # §4: "70% / 15% / 15%"
  val: 0.15
  test: 0.15
  by: "trajectory"             # §4: "By trajectory, never by frame"

# === Neighbor cutoff for nonbonded graph edges ===
graph:
  neighbor_cutoff: 2.5         # σ. Include WCA + some buffer for graph connectivity

# === Chain initialization ===
initialization:
  method: "linear"             # "linear" (stretched) or "random_walk"
  spacing: 1.0                 # Initial bead spacing (σ)

# === Box size ===
box:
  L: 100.0                     # Large box to avoid periodic boundary effects for single chain
  periodic: true               # Boundary conditions

# === Random seed ===
seed: 42                       # Base seed; each trajectory uses unique_seed(traj_id)

# === Model ===
model:
  type: "baseline_gnn"          # Model 1 from README: baseline message-passing GNN
  hidden_dim: 128               # Hidden dimension for node/edge embeddings
  n_layers: 4                   # Number of message passing layers
  dropout: 0.0                  # Dropout rate (0 for baseline)
  activation: "silu"            # Activation function: silu, relu, gelu, tanh
  node_input_dim: 4             # position(3) + bead_index(1)
  edge_input_dim: 5             # displacement(3) + distance(1) + bond_type(1)

# === Training ===
training:
  epochs: 200                   # Maximum training epochs
  batch_size: 32                # Mini-batch size
  lr: 1.0e-3                    # Initial learning rate
  weight_decay: 1.0e-5          # L2 regularization
  scheduler: "cosine"           # LR scheduler: cosine annealing
  patience: 20                  # Early stopping patience (epochs)
  physics_loss_weight: 0.0      # 0 for baseline (Model 1), >0 for physics-informed (Model 2)

# === Evaluation ===
evaluation:
  rollout_lengths: [100, 500, 1000, 5000]
  metrics:
    - "mse"
    - "bond_length_distribution"
    - "rg_scaling"
    - "energy_drift"
    - "excluded_volume_violations"
    - "steps_until_divergence"
    - "msd"
    - "temperature_consistency"
